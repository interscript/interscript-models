# Model-BOM lineage registry.
#
# models.yaml records artifact sha256/urls, license, metrics and parity, but
# leaves the model -> training-corpus linkage implicit (prose trained_from
# notes or card text). This registry makes that linkage declarative for the
# SPDX 3.0-style Model BOM (scripts/generate_model_bom.py):
#
#   shipped models  -> `corpora` list resolved against corpora/*.yaml
#                      (+ optional `lineage` training-chain notes)
#   pending models  -> full gated-pending entry (status, gate, lineage)
#
# Every value here is transcribed from the org's recorded evidence
# (models.yaml, corpora/*.yaml, cards/*.md, TODO.sota/*). Artifact
# sha256/urls are NEVER pre-staged for pending models (owner law,
# TODO.sota/92: the models.yaml ship entry is created at ship time with
# real artifact data).

heb-vocalized-plane-3.0:
  corpora: [hebrew-v4, heb-knesset-weak]
  lineage:
    - step: WO92 stage 1 (weak pretrain)
      detail: >-
        run-093-heb-weak-pretrain: 1,500,000 deduped knesset-v6 weak units
        (Dicta machine labels — weak supervision only) COMBINED with the
        full gold corpus (50,303 gold), 1 epoch
        (cards/heb-vocalized-plane-3.0.md).
    - step: WO92 stage 2 (gold SFT)
      detail: >-
        run-094-heb-gold-sft (train_hebrew_sft_hf.py, HF Jobs a100-large),
        resumed from run-093 best with the exact crown recipe; inventory
        inherited byte-identical (labels.sha edd595d96d09)
        (cards/heb-vocalized-plane-3.0.md).
  source_refs:
    card: cards/heb-vocalized-plane-3.0.md

urd-vocalized-2.0:
  status: gated-pending
  ship_name: urd-vocalized-2.0
