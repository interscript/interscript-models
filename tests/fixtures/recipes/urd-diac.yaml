id: urd-diac
task: diacritization
corpora:
  train: urd-dia@v1
  test: urd-dia@v1#test
model: byt5-base
stages:
  - stage: sft
    route: legacy:interscript-train/train_urd_diac_base_hf.py
    params: {epochs: 2, bs: 16, accum: 2, maxlen: 512}
  - stage: decode_policy
    params: {rep_penalty: 1.2, no_repeat_ngram: 3}
gates:
  quality: {cer_max: 0.045}
  parity: {mode: single-row, agree_min: 0.98, three_way: true}
negative_results:
  - dynamic-int8 quantization destroys byt5 seq2seq decode (0.44 vs 0.16 CER)
  - RL rollouts are knowledge-limited at SFT convergence — never retry
  - LLM teachers hallucinate haraqat — banned for diacritization labels
